# version: "3.8" # Docker Compose v2부터는 version을 쓰지 않음, 무시만 할 뿐 문제는 없음

services:
  nginx:
    image: nginx:1.25
    container_name: commerce-infra-nginx
    restart: always # 이 컨테이너는 서버 생명주기와 같음
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./nginx/html:/usr/share/nginx/html:ro # 임시 index.html
    networks:
      - commerce-network

  mysql:
    image: mysql:8.0
    container_name: commerce-mysql
    restart: always # 이 컨테이너는 서버 생명주기와 같음
    env_file:
      - .env
    volumes:
      - ./mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306" # 서버 localhost 에서만 접근 허용
    networks:
      - commerce-network

  redis:
    image: redis:7
    container_name: commerce-redis
    restart: always # 이 컨테이너는 서버 생명주기와 같음
    ports:
      - "127.0.0.1:6379:6379" # 서버 localhost 에서만 접근 허용
    networks:
      - commerce-network

  kafka:
    image: bitnami/kafka:3.7
    container_name: commerce-kafka
    restart: always
    ports:
      - "127.0.0.1:9092:19092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092 # Kafka가 컨테이너 내부에서 리슨하는 포트 (bootstrap)
      # INTERNAL(9092): 도커 네트워크 내부 컨테이너용
      # CONTROLLER(9093): KRaft 컨트롤러 통신용
      # EXTERNAL(19092): 컨테이너 내부 외부용 리스너 포트 (호스트에서는 ports 매핑된 9092로 접근)
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://commerce-kafka:9092,EXTERNAL://localhost:19092 # 클라이언트에게 안내할 접속 주소
      # 도커 네트워크 내부는 commerce-kafka:9092
      # 외부는 ssh -N -L 19092:127.0.0.1:9092 로 터널링
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@commerce-kafka:9093
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_KRAFT_CLUSTER_ID=abcdefghijklmnopqrstuv
    volumes:
      - ./kafka-data:/bitnami/kafka
    networks:
      - commerce-network

networks:
  commerce-network:
    name: commerce-network
