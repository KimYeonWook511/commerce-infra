# version: "3.8" # Docker Compose v2부터는 version을 쓰지 않음, 무시만 할 뿐 문제는 없음

services:
  nginx:
    image: nginx:1.25
    container_name: commerce-infra-nginx
    restart: always # 이 컨테이너는 서버 생명주기와 같음
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./nginx/html:/usr/share/nginx/html:ro # 임시 index.html
    networks:
      - commerce-network

  mysql:
    image: mysql:8.0
    container_name: commerce-mysql
    restart: always # 이 컨테이너는 서버 생명주기와 같음
    env_file:
      - .env
    volumes:
      - ./mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306" # 서버 localhost 에서만 접근 허용
    networks:
      - commerce-network

  redis:
    image: redis:7
    container_name: commerce-redis
    restart: always # 이 컨테이너는 서버 생명주기와 같음
    ports:
      - "127.0.0.1:6379:6379" # 서버 localhost 에서만 접근 허용
    networks:
      - commerce-network

  kafka:
    image: apache/kafka:4.1.1
    container_name: commerce-kafka
    restart: always
    ports:
      - "127.0.0.1:9092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Kafka가 컨테이너 내부에서 리슨하는 포트 (bootstrap)
      # - INTERNAL(9092): 도커 네트워크 내부 컨테이너용
      # - CONTROLLER(9093): KRaft 컨트롤러 통신용
      # - EXTERNAL(19092): 컨테이너 내부 외부용 리스너 포트
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      # 클라이언트에게 안내할 주소
      # - 도커 네트워크 내부 컨테이너: commerce-kafka:9092 (도커 네트워크 내부 통신)
      # - 호스트(맥북) 접속: ssh -N -L 19092:127.0.0.1:9092 로 터널링
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://commerce-kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@commerce-kafka:9093
      # 단일 브로커 구성이라 복제본 1개 — 브로커를 늘리면 이 값들도 함께 올려야 함
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # KRaft 클러스터 ID (한 번 정하면 유지)
      KAFKA_CLUSTER_ID: abcdefghijklmnopqrstuv
      # LOG 저장소 위치 지정
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - ./kafka-data-local:/tmp/kraft-combined-logs
    networks:
      - commerce-network

  # 모니터링 프로세스가 도커 소켓에 직접 붙지 않게 한 겹 둔다.
  # 소켓에 접근할 수 있으면 특권 컨테이너를 띄워 호스트를 장악할 수 있어,
  # 소켓 접근 권한은 사실상 root 권한이다.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-socket-proxy
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375" # 루프백에만. 열면 프록시를 둔 의미가 사라진다
    environment:
      CONTAINERS: 1 # 목록·상세·로그가 전부 여기에 들어간다

      # 나머지는 전부 잠근다
      POST: 0       # 쓰기 금지. 컨테이너 생성/중지/삭제 불가
      EXEC: 0       # 컨테이너 안에서 명령 실행 불가
      IMAGES: 0
      VOLUMES: 0
      NETWORKS: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
      SWARM: 0
      NODES: 0
      SYSTEM: 0
      INFO: 0
      BUILD: 0
      COMMIT: 0
      PLUGINS: 0
      DISTRIBUTION: 0
      SESSION: 0
      AUTH: 0
    networks:
      - commerce-network

networks:
  commerce-network:
    name: commerce-network
