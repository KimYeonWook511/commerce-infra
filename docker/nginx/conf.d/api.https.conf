# 현재 미사용 — api 서브도메인 미확보. README의 '도메인' 참고.
server {
    listen 443 ssl;
    server_name api.kyw511.ddns.net;

    # 루트 도메인 인증서 (서브도메인 확보 시 SAN으로 재발급)
    ssl_certificate /etc/letsencrypt/live/kyw511.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kyw511.ddns.net/privkey.pem;

    # nginx - backend 통신이 내부 통신으로만 하니까 http로 충분 (https는 오버헤드가 발생함)
    # 만약 nginx - backend 가 외부 네트워크를 사용한 통신을 한다면 https로 바꿔야 함!!
    location / {
        # proxy_pass에 변수를 쓰면 nginx 기동 시점이 아니라 요청 시점에 이름을 푼다.
        # 상수로 적으면 백엔드 컨테이너가 없을 때 nginx가 기동조차 못 한다.
        resolver 127.0.0.11 valid=10s; # 도커 내장 DNS
        set $backend http://commerce-backend:8080;
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
