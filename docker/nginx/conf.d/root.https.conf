server {
    listen 443 ssl;
    server_name kyw511.ddns.net;

    ssl_certificate /etc/letsencrypt/live/kyw511.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kyw511.ddns.net/privkey.pem;

    root /usr/share/nginx/html;   # docker-compose에서 마운트한 경로
    index index.html;

    location / {
        try_files $uri $uri/ =404; # 요청한 경로에 그 파일 있는지 확인 | 없으면 404 반환
    }

    # 모니터링 페이지. 호스트에서 도는 프로세스로 넘긴다.
    # 끝 슬래시가 없으면 페이지가 상대 경로로 보내는 요청이 한 단계 위로 새어 깨진다.
    location = /status { return 301 /status/; }

    location /status/ {
        auth_basic           "서버 상태";
        auth_basic_user_file /etc/nginx/.htpasswd-pistat;
        limit_req zone=pistat burst=5 nodelay;

        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_pass http://host.docker.internal:8088/; # 끝의 / 가 /status 접두사를 떼어낸다

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 외부 감시 서비스는 로그인을 못 하므로 이 경로만 인증을 뺀다.
    # 응답이 "ok" 한 단어뿐이라 노출되는 정보가 없다.
    location = /status/api/health {
        auth_basic off;
        proxy_pass http://host.docker.internal:8088/api/health;
        access_log off;
    }
}
