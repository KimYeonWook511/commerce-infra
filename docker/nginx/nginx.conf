# nginx 워커 프로세스 수를 자동으로 설정 (보통 CPU 코어 수에 맞게 잡힘)
worker_processes auto;

events {
    # 워커 프로세스 하나가 동시에 처리할 수 있는 최대 연결 수 (1024면 이론상 최대 동시 연결 = worker_processes × 1024)
    worker_connections 1024;
}

http {
    # MIME 타입 정의 파일 로드 (예: .html → text/html, .css → text/css)
    include       /etc/nginx/mime.types;
    # MIME 타입을 알 수 없는 파일의 기본 타입
    default_type  application/octet-stream;

    # 정적 파일을 빠르게 보내기 위한 성능 옵션
    # 리버스 프록시에선 별 효능은 없지만 on으로 해둬도 문제 없음
    sendfile on; # sendfile 시스템 콜 사용 (커널 레벨에서 파일을 바로 전송 → 성능 향상)
    tcp_nopush on; # sendfile 사용 시 패킷을 최대한 모아서 전송 (네트워크 효율 개선)
    tcp_nodelay on; # 작은 패킷도 즉시 전송 (지연 최소화, 실시간 응답성 개선)

    # keep-alive 연결 유지 시간 (초)
    keepalive_timeout 65;
    # MIME 타입 해시 테이블 크기 (타입이 많을 때 해시 충돌 방지)
    types_hash_max_size 2048;

    # 로그 (문제 생기면 여기부터 봄)
    access_log /var/log/nginx/access.log; # 접근 로그 위치 (누가 언제 어떤 요청을 했는지 기록)
    error_log  /var/log/nginx/error.log warn; # 에러 로그 위치와 로그 레벨 (warn = warning 이상만 기록)

    # 실제 서비스별(server 블록) 설정 파일 로드
    include /etc/nginx/conf.d/*.conf;
}
